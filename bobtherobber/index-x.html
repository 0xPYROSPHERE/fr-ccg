<!DOCTYPE html>
<html lang=en>

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex,nofollow">
    <base href="https://cdn.jsdelivr.net/gh/0xPYROSPHERE/fr-ccg@main/bobtherobber/">
    <title>Bob The Robber | Friv</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            overflow: hidden;
        }

        #inner {
            margin: 0 auto;
            width: 133vh;
            height: 100vh;
            position: relative;
            box-shadow: 0 0 5vmin 1vmin black;
        }

        #spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            margin: auto;
            height: 10vh;
            width: 10vh;
            border-radius: 50%;
            border-style: solid;
            border-width: 2vh;
            border-color: white;
            box-shadow: 1vh 1vh 1vh rgba(0, 0, 0, 0.4);
            animation: spinner 1s linear forwards infinite;
        }

        @keyframes spinner {
            0% {
                border-left-color: green;
                border-top-color: white;
                border-right-color: white;
                border-bottom-color: lime;
            }

            25% {
                border-left-color: lime;
                border-top-color: green;
                border-right-color: white;
                border-bottom-color: white;
            }

            50% {
                border-left-color: white;
                border-top-color: lime;
                border-right-color: green;
                border-bottom-color: white;
            }

            75% {
                border-left-color: white;
                border-top-color: white;
                border-right-color: lime;
                border-bottom-color: green;
            }

            100% {
                border-left-color: green;
                border-top-color: white;
                border-right-color: white;
                border-bottom-color: lime;
            }
        }

    </style>
    <script>
        window.fileMergerConfig = {
            files: [
                {name: "bobtherobber.js", parts: 2}
            ],
            basePath: "",
            debug: true
        }
    </script>
    <script src="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@ac5cdfc0042aca584e72619375b4aca948a9243c/merge.js"></script>
</head>

<body>
    
    <div id=spinner></div>
    <div id="inner"></div>

    <script>
        fetch("bobtherobber.js")
            .then(response => response.blob())
            .then(scriptBlob => {
                let scriptUrl = URL.createObjectURL(scriptBlob);
                let scriptElement = document.createElement("script");
                scriptElement.onload = setTimeout(function(){spinner.style.display='none'},200);
                scriptElement.src = scriptUrl;
                document.body.append(scriptElement);
            })
    </script>
    
    <script>
        var intervalID = setInterval(function() {
            if (document.getElementById('stage0') !== null) {
                document.getElementById('stage0').firstChild.style.backgroundColor = "rgb(0, 0, 0)";
                var node = document.getElementById("stage0");
                if (node.parentNode) node.parentNode.removeChild(node);
                document.getElementById('inner').appendChild(node);
                clearInterval(intervalID);
            }
        }, 500);

        

        function siteLockGPI() {
            clearTimeout(sitelockTimeout);
        }
        
        siteLockGPI();

        /////////////////////////////////////////////////////

        const doResize = true;
        const focusWindow = true;
		const timedReloadEnabled = false;
		const auxSetting = false;


        
        function resizeGameCanvas() {
            const canvas = document.querySelector("canvas");

            if (canvas) {
                canvas.style.maxWidth = "100vw";
                canvas.style.maxHeight = "100vh";
            }
        }

        if (doResize) {
            const canvasInterval = setInterval(resizeGameCanvas, 1500);
        }

        if (focusWindow) {
            window.addEventListener('blur', () => {
                window.focus();
            });
        }

    </script>

</body>

</html>
